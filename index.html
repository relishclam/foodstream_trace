canvas.px{position:fixed;inset:0;width:100%;height:100%}
.stage{position:relative;z-index:2;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--padt) var(--padx) var(--padb)}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:var(--eyebrow);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.eyebrow span{color:var(--dim);letter-spacing:.1em;margin-left:.9em;text-transform:none}
.swoosh{width:var(--sw);height:auto;margin:var(--swmt) 0 var(--swmb);filter:drop-shadow(0 0 26px rgba(34,211,238,.5)) drop-shadow(0 0 80px rgba(10,132,255,.35))}
h1{font-family:var(--serif);font-weight:700;font-size:var(--h1);line-height:1;color:var(--text);letter-spacing:-.01em}

.sub{margin-top:var(--subm);font-size:var(--sub);color:var(--body);max-width:30em}
.apps{position:relative;margin-top:var(--gap-apps);display:flex;align-items:stretch;justify-content:center;gap:var(--appgap)}
.app{display:flex;flex-direction:column;align-items:center;gap:var(--capgap);color:inherit;text-decoration:none;outline-offset:6px}
.plate{flex:1;display:grid;place-items:center;transition:transform .25s,filter .25s}
.app:hover .plate,.app:focus-visible .plate{transform:translateY(-5px);filter:drop-shadow(0 0 16px rgba(34,211,238,.55))}
.plate img{display:block;filter:drop-shadow(0 0 10px rgba(255,255,255,.16))}
.clam .plate img{height:var(--clam-h);width:auto}
.pram .plate img{width:var(--pram-w);max-width:100%;height:auto}
picture{display:contents}
.apps::before{content:"";position:absolute;inset:-18% -16% -14%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(10,15,20,.85),rgba(10,15,20,.78) 62%,rgba(10,15,20,0))}
.cap{font-family:var(--mono);font-size:var(--cap);letter-spacing:.18em;text-transform:uppercase;color:var(--body)}
.foot{position:absolute;left:0;right:0;bottom:var(--footb);text-align:center;font-family:var(--mono);font-size:var(--foot);letter-spacing:.14em;color:var(--dim);z-index:2}

  .stage{justify-content:flex-start}

<script>
/* Faint pixel stream behind the content, echoing the logo. Seeded, so every render is identical. */
(function(){
  var c=document.querySelector('canvas.px'),x=c.getContext('2d');
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  function bez(t,a,b,cc,d){var m=1-t;return m*m*m*a+3*m*m*t*b+3*m*t*t*cc+t*t*t*d;}
  function dbez(t,a,b,cc,d){var m=1-t;return 3*m*m*(b-a)+6*m*t*(cc-b)+3*t*t*(d-cc);}
  function draw(){
    var dpr=Math.min(window.devicePixelRatio||1,3),w=innerWidth,h=innerHeight;
    c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
    var r=rng(7),g=Math.max(6,Math.round(Math.min(w,h)/70)),N=900;
    var P=w>h?[[-.04,.98],[.22,.30],[.62,1.14],[1.04,.04]]:[[-.06,.99],[.10,.62],[.95,.58],[1.06,.02]];
    for(var i=0;i<N;i++){
      var t=r(),env=Math.pow(Math.sin(Math.PI*t),.5);
      var px=bez(t,P[0][0],P[1][0],P[2][0],P[3][0])*w, py=bez(t,P[0][1],P[1][1],P[2][1],P[3][1])*h;
      var dx=dbez(t,P[0][0],P[1][0],P[2][0],P[3][0])*w, dy=dbez(t,P[0][1],P[1][1],P[2][1],P[3][1])*h, L=Math.hypot(dx,dy)||1;
      var u=(r()+r()+r()-1.5)/1.5, half=Math.min(w,h)*.10*env, sc=(1-env)*g*8;
      var X=px+(-dy/L)*u*half+(r()*2-1)*sc, Y=py+(dx/L)*u*half+(r()*2-1)*sc;
      X=Math.round(X/g)*g;Y=Math.round(Y/g)*g;
      var s=Math.max(2,g*(.35+.65*env)*(.55+.45*r()));
      var k=t, R=Math.round(46+(10-46)*k), G=Math.round(230+(132-230)*k), B=Math.round(246+(255-246)*k);
      x.globalAlpha=(.05+.20*env)*(.5+.5*r());
      x.fillStyle='rgb('+R+','+G+','+B+')';
      x.fillRect(X,Y,s,s);
    }
    x.globalAlpha=1;
  }
  draw();addEventListener('resize',draw);
})();
